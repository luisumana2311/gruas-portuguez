# Configuración de Netlify: con esto basta con conectar el repositorio de GitHub.
# El dominio final se define con la variable SITE_URL en el panel de Netlify
# (Site configuration → Environment variables); si no está, se usa sitio.dominio.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Archivos con hash en el nombre (JS, CSS, fuentes): se pueden guardar en caché para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos y logos: caché de una semana (cambian poco, pero no llevan hash).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
